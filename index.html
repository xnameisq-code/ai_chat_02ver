<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>닉네임 카드 생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&family=Gothic+A1:wght@400;500;700&family=Sunflower:wght@300;500;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #f0f0f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── 전체 레이아웃 ── */
  .app-wrap {
    display: flex;
    gap: 16px;
    padding: 16px;
    width: 100%;
    max-width: 1920px;
    align-items: flex-start;
  }

  /* ── 좌측 컨트롤 패널 ── */
  .panel {
    width: 320px;
    min-width: 300px;
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    position: sticky;
    top: 16px;
  }
  .panel::-webkit-scrollbar { width: 5px; }
  .panel::-webkit-scrollbar-thumb { background: #f9a8d4; border-radius: 4px; }

  .panel h2 {
    font-size: 15px;
    font-weight: 700;
    color: #be185d;
    border-bottom: 2px solid #fbcfe8;
    padding-bottom: 6px;
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .panel-section label {
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .panel-section input[type="text"],
  .panel-section textarea {
    width: 100%;
    border: 1.5px solid #fbcfe8;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
    resize: vertical;
  }
  .panel-section input[type="text"]:focus,
  .panel-section textarea:focus { border-color: #ec4899; }

  /* 색상 팔레트 */
  .color-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .color-row label { font-size: 12px; color: #6b7280; min-width: 80px; }
  .color-row input[type="color"] {
    width: 32px; height: 32px;
    border: none; border-radius: 6px;
    cursor: pointer; padding: 2px;
    background: transparent;
  }
  .color-presets {
    display: flex; gap: 4px; flex-wrap: wrap;
  }
  .color-preset {
    width: 22px; height: 22px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
    transition: transform .15s, border-color .15s;
  }
  .color-preset:hover { transform: scale(1.2); }

  /* 폰트 선택 */
  .font-select {
    width: 100%;
    border: 1.5px solid #fbcfe8;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
  }

  /* 이미지 업로드 버튼 */
  .upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    background: #fdf2f8;
    border: 1.5px dashed #f9a8d4;
    border-radius: 8px;
    font-size: 12px;
    color: #be185d;
    cursor: pointer;
    transition: background .2s;
    font-family: inherit;
  }
  .upload-btn:hover { background: #fce7f3; }

  /* 체크박스 그룹 */
  .check-group {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .check-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border: 1.5px solid #fbcfe8;
    border-radius: 20px;
    font-size: 11.5px;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
    color: #6b7280;
  }
  .check-item input { display: none; }
  .check-item.checked {
    background: linear-gradient(135deg, #ec4899, #f472b6);
    border-color: #ec4899;
    color: #fff;
    font-weight: 600;
  }

  /* 라디오 버튼 그룹 */
  .radio-group {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .radio-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border: 1.5px solid #fbcfe8;
    border-radius: 20px;
    font-size: 11.5px;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
    color: #6b7280;
  }
  .radio-item input { display: none; }
  .radio-item.checked {
    background: #fdf2f8;
    border-color: #ec4899;
    color: #be185d;
    font-weight: 600;
  }

  /* 저장 버튼 */
  .save-btn {
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, #ec4899, #f472b6);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: opacity .2s;
  }
  .save-btn:hover { opacity: .85; }

  /* 직접 입력 태그 */
  .tag-input-row {
    display: flex;
    gap: 5px;
    margin-top: 4px;
  }
  .tag-input-row input {
    flex: 1;
    border: 1.5px solid #fbcfe8;
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 12px;
    outline: none;
    font-family: inherit;
  }
  .tag-input-row button {
    padding: 5px 10px;
    background: #ec4899;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }

  /* ── 우측 미리보기 영역 ── */
  .preview-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }
  .preview-label {
    font-size: 13px;
    color: #9ca3af;
    font-weight: 500;
    align-self: flex-start;
    padding-left: 4px;
  }
  .preview-scaler {
    width: 100%;
    overflow-x: auto;
  }

  /* ── 카드 본체 (1800×1200) ── */
  #card {
    width: 1800px;
    height: 1200px;
    position: relative;
    background: #fff;
    transform-origin: top left;
    overflow: hidden;
    font-family: 'Noto Sans KR', sans-serif;
  }

  /* 상단 헤더 이미지 */
  #header-zone {
    width: 100%;
    height: 420px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #fce7f3 0%, #dbeafe 100%);
    cursor: crosshair;
  }
  #header-img {
    position: absolute;
    transform-origin: center center;
    will-change: transform;
    user-select: none;
  }
  #header-img.no-img {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #f9a8d4;
    letter-spacing: .05em;
  }
  .header-img-obj {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    pointer-events: none;
    transform-origin: center center;
  }

  /* 제작자 표기 */
  .credit {
    position: absolute;
    top: 10px;
    right: 18px;
    font-size: 13px;
    color: rgba(255,255,255,.75);
    z-index: 10;
    font-weight: 300;
    letter-spacing: .03em;
    text-shadow: 0 1px 4px rgba(0,0,0,.4);
  }

  /* ── 중간 섹션 ── */
  #mid-section {
    display: flex;
    align-items: stretch;
    height: 320px;
    border-bottom: 2px solid #fbcfe8;
  }

  /* 좌측/우측 이미지 박스 */
  .side-img-box {
    width: 240px;
    min-width: 240px;
    position: relative;
    overflow: hidden;
    background: #fdf2f8;
    cursor: crosshair;
    border: 3px solid #fbcfe8;
  }
  .side-img-obj {
    position: absolute;
    object-fit: cover;
    transform-origin: center center;
    user-select: none;
    pointer-events: none;
  }
  .side-img-placeholder {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: #f9a8d4;
    font-weight: 500;
    flex-direction: column;
    gap: 6px;
  }
  .side-img-placeholder span { font-size: 24px; }

  /* 보딩 패스 박스 */
  #boarding-box {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #fff9fb;
  }
  #boarding-pass {
    width: 780px;
    height: 270px;
    display: flex;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(236,72,153,.15);
    position: relative;
    border: 2px solid #fbcfe8;
  }

  /* 보딩패스 좌측 스트라이프 */
  .bp-stripe {
    width: 28px;
    background: repeating-linear-gradient(
      -45deg,
      #fbcfe8 0px, #fbcfe8 10px,
      #fff 10px, #fff 20px
    );
    flex-shrink: 0;
  }

  /* 보딩패스 중앙 내용 */
  .bp-body {
    flex: 1;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #fff;
    position: relative;
  }
  .bp-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .2em;
    color: #be185d;
  }
  .bp-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    font-size: 11px;
  }
  .bp-field-label {
    color: #9ca3af;
    font-size: 10px;
    margin-bottom: 2px;
    font-weight: 500;
  }
  .bp-field-val {
    font-size: 12px;
    font-weight: 600;
    color: #374151;
    min-height: 16px;
  }

  /* 체크 항목들 */
  .bp-checks {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .bp-check-item {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    color: #9ca3af;
  }
  .bp-check-item.on { color: #ec4899; font-weight: 600; }
  .bp-check-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    border: 1.5px solid #d1d5db;
    background: transparent;
    flex-shrink: 0;
  }
  .bp-check-item.on .bp-check-dot {
    background: #ec4899;
    border-color: #ec4899;
  }

  /* 점선 구분선 */
  .bp-divider {
    width: 2px;
    background: repeating-linear-gradient(
      to bottom, #fbcfe8 0px, #fbcfe8 6px, transparent 6px, transparent 12px
    );
    flex-shrink: 0;
    margin: 0 8px;
  }

  /* 보딩패스 우측 (닉네임+인용구) */
  .bp-right {
    width: 280px;
    padding: 18px 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: #fff;
  }
  .bp-nickname-area {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
    overflow: hidden;
  }
  .bp-nickname-text {
    font-weight: 700;
    color: #111827;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    font-size: clamp(14px, 3.2vw, 26px);
    transition: font-size .2s;
  }
  .bp-plane { color: #ec4899; font-size: 16px; flex-shrink: 0; }
  .bp-account {
    font-size: 13px;
    color: #6b7280;
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bp-quote {
    font-size: clamp(10px, 1.8vw, 14px);
    color: #4b5563;
    line-height: 1.5;
    font-style: italic;
    overflow-wrap: break-word;
    word-break: keep-all;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }



  /* ── 하단 세 박스 ── */
  #bottom-section {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    flex: 1;
  }
  .bottom-box {
    border: 2px solid #fbcfe8;
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: hidden;
  }
  .bottom-box:not(:last-child) {
    border-right: none;
  }

  .box-chip {
    display: inline-flex;
    align-items: center;
    padding: 3px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    align-self: flex-start;
  }

  .tag-display {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    line-height: 1.8;
  }
  .tag-display span {
    font-size: 13px;
    color: #374151;
    position: relative;
  }
  .tag-display span.active {
    background: linear-gradient(transparent 50%, #fde68a 50%);
    font-weight: 600;
    color: #111827;
  }

  /* ── 편집 오버레이 ── */
  .edit-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(236,72,153,.08);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    z-index: 5;
  }
  .side-img-box:hover .edit-overlay,
  #header-zone:hover .edit-overlay {
    opacity: 1;
  }
  .edit-overlay span {
    background: rgba(236,72,153,.8);
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  /* 이미지 드래그 커서 힌트 */
  .dragging-img { cursor: grabbing !important; }

  /* ── 슬라이더 (이미지 스케일) ── */
  .slider-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #6b7280;
  }
  .slider-wrap input[type="range"] {
    flex: 1;
    accent-color: #ec4899;
  }

  /* 미리보기 스케일 컨테이너 */
  #preview-container {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,.15);
  }
</style>
</head>
<body>

<div class="app-wrap">
  <!-- ═══════════════════════════════════════
       좌측 컨트롤 패널
  ═══════════════════════════════════════ -->
  <div class="panel">
    <h2>✦ 카드 편집기</h2>

    <!-- 폰트 선택 -->
    <div class="panel-section">
      <label>폰트</label>
      <select class="font-select" id="fontSelect" onchange="applyFont()">
        <option value="'Noto Sans KR', sans-serif">Noto Sans KR (고딕)</option>
        <option value="'Noto Serif KR', serif">Noto Serif KR (명조)</option>
        <option value="'Gothic A1', sans-serif">Gothic A1</option>
        <option value="'Sunflower', sans-serif">Sunflower</option>
        <option value="'Black Han Sans', sans-serif">Black Han Sans (블랙)</option>
      </select>
    </div>

    <!-- 헤더 이미지 -->
    <div class="panel-section">
      <label>상단 헤더 이미지</label>
      <button class="upload-btn" onclick="document.getElementById('headerImgInput').click()">
        📷 헤더 이미지 업로드
      </button>
      <input type="file" id="headerImgInput" accept="image/*" style="display:none" onchange="uploadHeader(event)">
      <div class="slider-wrap">
        <span>크기</span>
        <input type="range" id="headerScale" min="50" max="300" value="100" oninput="updateHeaderTransform()">
        <span id="headerScaleVal">100%</span>
      </div>
    </div>

    <!-- 중앙 좌/우 이미지 -->
    <div class="panel-section">
      <label>중앙 좌측 이미지</label>
      <button class="upload-btn" onclick="document.getElementById('leftImgInput').click()">
        📷 좌측 이미지 업로드
      </button>
      <input type="file" id="leftImgInput" accept="image/*" style="display:none" onchange="uploadSide(event,'left')">
      <div class="slider-wrap">
        <span>크기</span>
        <input type="range" id="leftScale" min="50" max="300" value="100" oninput="updateSideTransform('left')">
        <span id="leftScaleVal">100%</span>
      </div>
    </div>
    <div class="panel-section">
      <label>중앙 우측 이미지</label>
      <button class="upload-btn" onclick="document.getElementById('rightImgInput').click()">
        📷 우측 이미지 업로드
      </button>
      <input type="file" id="rightImgInput" accept="image/*" style="display:none" onchange="uploadSide(event,'right')">
      <div class="slider-wrap">
        <span>크기</span>
        <input type="range" id="rightScale" min="50" max="300" value="100" oninput="updateSideTransform('right')">
        <span id="rightScaleVal">100%</span>
      </div>
    </div>

    <!-- 닉네임 / 계정 -->
    <div class="panel-section">
      <label>닉네임</label>
      <input type="text" id="nicknameInput" placeholder="닉네임" oninput="updateBP()" maxlength="30">
    </div>
    <div class="panel-section">
      <label>계정</label>
      <input type="text" id="accountInput" placeholder="@계정명" oninput="updateBP()" maxlength="30">
    </div>
    <div class="panel-section">
      <label>인용구</label>
      <textarea id="quoteInput" rows="3" placeholder="인용구를 입력하세요" oninput="updateBP()"></textarea>
    </div>

    <!-- 연령 -->
    <div class="panel-section">
      <label>연령</label>
      <div class="radio-group" id="ageGroup">
        <label class="radio-item" onclick="selectRadio(this,'ageGroup')"><input type="radio" name="age" value="성인">성인</label>
        <label class="radio-item" onclick="selectRadio(this,'ageGroup')"><input type="radio" name="age" value="미성년자">미성년자</label>
        <label class="radio-item" onclick="selectRadio(this,'ageGroup')"><input type="radio" name="age" value="비공개">비공개</label>
      </div>
    </div>

    <!-- FUB FREE -->
    <div class="panel-section">
      <label>FUB Free</label>
      <div class="radio-group" id="fubGroup">
        <label class="radio-item" onclick="selectRadio(this,'fubGroup')"><input type="radio" name="fub" value="O">O</label>
        <label class="radio-item" onclick="selectRadio(this,'fubGroup')"><input type="radio" name="fub" value="X">X</label>
      </div>
    </div>

    <!-- 관계 정리 -->
    <div class="panel-section">
      <label>관계 정리</label>
      <div class="check-group" id="relGroup">
        <label class="check-item" onclick="toggleCheck(this)"><input type="checkbox" value="블락 언팔 플언팔">블락 언팔 플언팔</label>
        <label class="check-item" onclick="toggleCheck(this)"><input type="checkbox" value="기타">기타</label>
      </div>
    </div>

    <!-- 지뢰 -->
    <div class="panel-section">
      <label>지뢰</label>
      <input type="text" id="mineInput" placeholder="직접 입력" oninput="updateBP()">
    </div>

    <!-- 트윗 성향 -->
    <div class="panel-section">
      <label>트윗 성향</label>
      <div class="check-group" id="tweetGroup">
        <label class="check-item" onclick="toggleCheck(this)"><input type="checkbox" value="일상">일상</label>
        <label class="check-item" onclick="toggleCheck(this)"><input type="checkbox" value="RT">RT</label>
        <label class="check-item" onclick="toggleCheck(this)"><input type="checkbox" value="인용">인용</label>
        <label class="check-item" onclick="toggleCheck(this)"><input type="checkbox" value="마음">마음</label>
        <label class="check-item" onclick="toggleCheck(this)"><input type="checkbox" value="로그">로그</label>
        <label class="check-item" onclick="toggleCheck(this)"><input type="checkbox" value="글">글</label>
        <label class="check-item" onclick="toggleCheck(this)"><input type="checkbox" value="그림">그림</label>
        <label class="check-item" onclick="toggleCheck(this)"><input type="checkbox" value="탐라대화">탐라대화</label>

  rightPos:  { x: 0, y: 0 },
  headerScale: 100,
  leftScale:   100,
  rightScale:  100,
};

// ────────────────────────────────────────
// 미리보기 스케일 (반응형)
// ────────────────────────────────────────
function scalePreview() {
  const card = document.getElementById('card');
  const container = document.getElementById('preview-container');
  const wrap = document.querySelector('.preview-scaler');
  const avail = wrap.clientWidth - 4;
  const scale = Math.min(1, avail / 1800);
  card.style.transform = `scale(${scale})`;
  container.style.width  = (1800 * scale) + 'px';
  container.style.height = (1200 * scale) + 'px';
}
window.addEventListener('resize', scalePreview);
window.addEventListener('load', scalePreview);
setTimeout(scalePreview, 100);

// ────────────────────────────────────────
// 폰트 적용
// ────────────────────────────────────────
function applyFont() {
  const f = document.getElementById('fontSelect').value;
  document.getElementById('card').style.fontFamily = f;
}

// ────────────────────────────────────────
// 보딩 패스 업데이트
// ────────────────────────────────────────
function updateBP() {
  const nn = document.getElementById('nicknameInput').value || '닉네임';
  const ac = document.getElementById('accountInput').value  || '계정';
  const qt = document.getElementById('quoteInput').value    || '인용구 입력란';
  const mn = document.getElementById('mineInput').value     || '—';

  const bpNN = document.getElementById('bpNickname');
  bpNN.textContent = nn;
  // 자동 폰트 축소
  const len = nn.length;
  if      (len <= 8)  bpNN.style.fontSize = '26px';
  else if (len <= 12) bpNN.style.fontSize = '20px';
  else if (len <= 16) bpNN.style.fontSize = '15px';
  else                bpNN.style.fontSize = '12px';

  document.getElementById('bpAccount').textContent = ac;

  const bpQ = document.getElementById('bpQuote');
  bpQ.textContent = qt;
  const qLen = qt.length;
  if      (qLen <= 40)  bpQ.style.fontSize = '14px';
  else if (qLen <= 80)  bpQ.style.fontSize = '12px';
  else if (qLen <= 120) bpQ.style.fontSize = '11px';
  else                  bpQ.style.fontSize = '10px';

  document.getElementById('bpMine').textContent = mn;
}

// ────────────────────────────────────────
// 라디오 선택 (연령, FUB)
// ────────────────────────────────────────
function selectRadio(el, groupId) {
  document.querySelectorAll(`#${groupId} .radio-item`).forEach(r => r.classList.remove('checked'));
  el.classList.add('checked');
  const val = el.querySelector('input').value;
  if (groupId === 'ageGroup') document.getElementById('bpAge').textContent = val;
  if (groupId === 'fubGroup') document.getElementById('bpFub').textContent = val;
  updateRelDisplay();
}

function updateRelDisplay() {
  const checked = [...document.querySelectorAll('#relGroup .check-item.checked')].map(c=>c.querySelector('input').value);
  document.getElementById('bpRel').textContent = checked.join(' ') || '—';
}

// ────────────────────────────────────────
// 체크 토글
// ────────────────────────────────────────
function toggleCheck(el) {
  el.classList.toggle('checked');
  const groupId = el.closest('.check-group').id;
  updateDisplay(groupId);
}

function updateDisplay(groupId) {
  const vals = [...document.querySelectorAll(`#${groupId} .check-item.checked`)].map(c=>c.querySelector('input').value);

  if (groupId === 'relGroup') {
    document.getElementById('bpRel').textContent = vals.join(' ') || '—';
    return;
  }

  const map = {
    tweetGroup:    'tweetDisplay',
    playGroup:     'playDisplay',
    cpGroup:       'cpDisplay',
    platformGroup: 'platformDisplay',
    tagGroup:      'tagDisplay',
  };
  const displayId = map[groupId];
  if (!displayId) return;

  const display = document.getElementById(displayId);
  const allItems = [...document.querySelectorAll(`#${groupId} .check-item`)];
  display.innerHTML = '';
  allItems.forEach(item => {
    const v = item.querySelector('input').value;
    const span = document.createElement('span');
    span.textContent = v;
    if (item.classList.contains('checked')) span.classList.add('active');
    display.appendChild(span);
    display.appendChild(document.createTextNode(' '));
  });
}

function initDisplays() {
  ['tweetGroup','playGroup','cpGroup','platformGroup','tagGroup'].forEach(g => updateDisplay(g));
}
initDisplays();

// ────────────────────────────────────────
// 직접 입력 태그 추가
// ────────────────────────────────────────
function addCustomTag(groupId, inputId) {
  const inp = document.getElementById(inputId);
  const val = inp.value.trim();
  if (!val) return;
  const group = document.getElementById(groupId);
  const lbl = document.createElement('label');
  lbl.className = 'check-item checked';
  lbl.onclick = function(){ toggleCheck(this); };
  lbl.innerHTML = `<input type="checkbox" value="${val}" checked>${val}`;
  group.appendChild(lbl);
  inp.value = '';
  updateDisplay(groupId);
}

// ────────────────────────────────────────
// 색상 적용
// ────────────────────────────────────────
function setColor(id, val) {
  document.getElementById(id).value = val;
  if (id.startsWith('chip')) applyChipColors();
  else if (id === 'highlightColor') applyHighlightColor();
  else applyColors();
}

function applyColors() {
  const border  = document.getElementById('borderColor').value;
  const midBg   = document.getElementById('midBg').value;
  const botBg   = document.getElementById('bottomBg').value;

  document.querySelectorAll('.bottom-box').forEach(b => b.style.background = botBg);
  document.querySelectorAll('.bottom-box').forEach(b => b.style.borderColor = border);
  document.getElementById('boarding-box').style.background = midBg;
  document.getElementById('boarding-pass').style.borderColor = border;
  document.querySelector('#mid-section').style.borderColor = border;
  document.querySelectorAll('.side-img-box').forEach(b => b.style.borderColor = border);
  document.querySelector('.bp-stripe').style.background = `repeating-linear-gradient(-45deg,${border} 0px,${border} 10px,#fff 10px,#fff 20px)`;
}

function applyChipColors() {
  const c1 = document.getElementById('chip1Color').value;
  const c2 = document.getElementById('chip2Color').value;
  const c3 = document.getElementById('chip3Color').value;
  ['chip1','chip1b','chip1c'].forEach(id => { const el = document.getElementById(id); if(el) el.style.background = c1; });
  const el2 = document.getElementById('chip2'); if(el2) el2.style.background = c2;
  const el3 = document.getElementById('chip3'); if(el3) el3.style.background = c3;
}

function applyHighlightColor() {
  const hc = document.getElementById('highlightColor').value;
  document.querySelectorAll('.tag-display .active').forEach(s => {
    s.style.backgroundImage = `linear-gradient(transparent 50%, ${hc} 50%)`;
  });
  // 새로 렌더될 때도 적용되도록 CSS 변수로 처리
  document.documentElement.style.setProperty('--hl-color', hc);
}

// CSS에 --hl-color 반영
const hlStyle = document.createElement('style');
hlStyle.id = 'hl-style';
document.head.appendChild(hlStyle);
function updateHlStyle() {
  const hc = document.getElementById('highlightColor').value;
  document.getElementById('hl-style').textContent =
    `.tag-display span.active { background-image: linear-gradient(transparent 50%, ${hc} 50%) !important; }`;
}
document.getElementById('highlightColor').addEventListener('input', updateHlStyle);
updateHlStyle();

// ────────────────────────────────────────
// 헤더 이미지 업로드 + 드래그
// ────────────────────────────────────────
function uploadHeader(e) {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = document.getElementById('header-img-el');
  img.src = url;
  img.style.display = 'block';
  document.getElementById('header-no-img').style.display = 'none';
  state.headerPos = { x: 0, y: 0 };
  updateHeaderTransform();
}

function updateHeaderTransform() {
  const scale = document.getElementById('headerScale').value;
  document.getElementById('headerScaleVal').textContent = scale + '%';
  state.headerScale = parseInt(scale);
  const img = document.getElementById('header-img-el');
  img.style.transform = `translate(${state.headerPos.x}px, ${state.headerPos.y}px) scale(${state.headerScale/100})`;
}

setupDrag('header-zone', 'header-img-el', state.headerPos, updateHeaderTransform);
setupDrag('leftImgBox',  'left-img-el',   state.leftPos,   () => updateSideTransform('left'));
setupDrag('rightImgBox', 'right-img-el',  state.rightPos,  () => updateSideTransform('right'));

function setupDrag(zoneId, imgId, posObj, updateFn) {
  const zone = document.getElementById(zoneId);
  let dragging = false, startX, startY, origX, origY;

  zone.addEventListener('mousedown', e => {
    const img = document.getElementById(imgId);
    if (img.style.display === 'none') return;
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    origX = posObj.x;   origY = posObj.y;
    zone.style.cursor = 'grabbing';
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const card = document.getElementById('card');
    const scale = parseFloat(card.style.transform.replace('scale(','')) || 1;
    posObj.x = origX + (e.clientX - startX) / scale;
    posObj.y = origY + (e.clientY - startY) / scale;
    updateFn();
  });
  window.addEventListener('mouseup', () => {
    dragging = false;
    zone.style.cursor = 'crosshair';
  });

  // 터치
  zone.addEventListener('touchstart', e => {
    const img = document.getElementById(imgId);
    if (img.style.display === 'none') return;
    dragging = true;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    origX = posObj.x;   origY = posObj.y;
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchmove', e => {
    if (!dragging) return;
    const card = document.getElementById('card');
    const scale = parseFloat(card.style.transform.replace('scale(','')) || 1;
    posObj.x = origX + (e.touches[0].clientX - startX) / scale;
    posObj.y = origY + (e.touches[0].clientY - startY) / scale;
    updateFn();
  }, { passive: false });
  window.addEventListener('touchend', () => { dragging = false; });
}

// ────────────────────────────────────────
// 사이드 이미지 업로드 + 드래그
// ────────────────────────────────────────
function uploadSide(e, side) {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const imgEl = document.getElementById(side === 'left' ? 'left-img-el' : 'right-img-el');
  const placeholder = document.getElementById(side === 'left' ? 'leftPlaceholder' : 'rightPlaceholder');
  imgEl.src = url;
  imgEl.style.display = 'block';
  placeholder.style.display = 'none';
  if (side === 'left') { state.leftPos = {x:0,y:0}; updateSideTransform('left'); }
  else                 { state.rightPos = {x:0,y:0}; updateSideTransform('right'); }
}

function updateSideTransform(side) {
  const scaleId = side === 'left' ? 'leftScale' : 'rightScale';
  const valId   = side === 'left' ? 'leftScaleVal' : 'rightScaleVal';
  const imgId   = side === 'left' ? 'left-img-el' : 'right-img-el';
  const pos     = side === 'left' ? state.leftPos : state.rightPos;
  const scale   = document.getElementById(scaleId).value;
  document.getElementById(valId).textContent = scale + '%';
  const img = document.getElementById(imgId);
  img.style.transform = `translate(${pos.x}px, ${pos.y}px) scale(${scale/100})`;
  img.style.transformOrigin = 'center center';
  img.style.top = '0'; img.style.left = '0';
  img.style.width = '100%'; img.style.height = '100%';
}

// ────────────────────────────────────────
// 이미지 저장
// ────────────────────────────────────────
async function saveCard() {
  const btn = document.querySelector('.save-btn');
  btn.textContent = '⏳ 저장 중...';
  btn.disabled = true;

  const card = document.getElementById('card');
  const origTransform = card.style.transform;
  card.style.transform = 'scale(1)';

  try {
    const canvas = await html2canvas(card, {
      scale: 2,
      width: 1800,
      height: 1200,
      useCORS: true,
      allowTaint: true,
      logging: false,
    });
    const link = document.createElement('a');
    link.download = '닉네임카드.png';
    link.href = canvas.toDataURL('image/png', 1.0);
    link.click();
  } catch(e) {
    alert('저장 중 오류가 발생했습니다: ' + e.message);
  }

  card.style.transform = origTransform;
  btn.textContent = '💾 이미지로 저장 (1800×1200)';
  btn.disabled = false;
}
</script>
