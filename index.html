<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보름 트친소표 생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Dodum&family=Hahmlet:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #f0f0f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── 전체 레이아웃 ── */
  .app-wrap {
    display: flex;
    gap: 16px;
    padding: 16px;
    width: 100%;
    max-width: 1920px;
    align-items: flex-start;
  }

  /* ── 좌측 컨트롤 패널 ── */
  .panel {
    width: 320px;
    min-width: 300px;
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    position: sticky;
    top: 16px;
  }
  .panel::-webkit-scrollbar { width: 5px; }
  .panel::-webkit-scrollbar-thumb { background: #f9a8d4; border-radius: 4px; }

  .panel h2 {
    font-size: 15px;
    font-weight: 700;
    color: #be185d;
    border-bottom: 2px solid #fbcfe8;
    padding-bottom: 6px;
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .panel-section label {
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .panel-section input[type="text"],
  .panel-section textarea {
    width: 100%;
    border: 1.5px solid #fbcfe8;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
    resize: vertical;
  }
  .panel-section input[type="text"]:focus,
  .panel-section textarea:focus { border-color: #ec4899; }

  /* 색상 팔레트 */
  .color-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .color-row label { font-size: 12px; color: #6b7280; min-width: 80px; }
  .color-row input[type="color"] {
    width: 32px; height: 32px;
    border: none; border-radius: 6px;
    cursor: pointer; padding: 2px;
    background: transparent;
  }
  .color-presets {
    display: flex; gap: 4px; flex-wrap: wrap;
  }
  .color-preset {
    width: 22px; height: 22px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
    transition: transform .15s, border-color .15s;
  }
  .color-preset:hover { transform: scale(1.2); }

  /* 폰트 선택 */
  .font-select {
    width: 100%;
    border: 1.5px solid #fbcfe8;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
  }

  /* 이미지 업로드 버튼 */
  .upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    background: #fdf2f8;
    border: 1.5px dashed #f9a8d4;
    border-radius: 8px;
    font-size: 12px;
    color: #be185d;
    cursor: pointer;
    transition: background .2s;
    font-family: inherit;
  }
  .upload-btn:hover { background: #fce7f3; }

  /* 체크박스 그룹 */
  .check-group {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .check-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border: 1.5px solid #fbcfe8;
    border-radius: 20px;
    font-size: 11.5px;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
    color: #6b7280;
  }
  .check-item input { display: none; }
  .check-item.checked {
    background: linear-gradient(135deg, #ec4899, #f472b6);
    border-color: #ec4899;
    color: #fff;
    font-weight: 600;
  }

  /* 라디오 버튼 그룹 */
  .radio-group {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .radio-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border: 1.5px solid #fbcfe8;
    border-radius: 20px;
    font-size: 11.5px;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
    color: #6b7280;
  }
  .radio-item input { display: none; }
  .radio-item.checked {
    background: #fdf2f8;
    border-color: #ec4899;
    color: #be185d;
    font-weight: 600;
  }

  /* 저장 버튼 */
  .save-btn {
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, #ec4899, #f472b6);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: opacity .2s;
  }
  .save-btn:hover { opacity: .85; }

  /* 직접 입력 태그 */
  .tag-input-row {
    display: flex;
    gap: 5px;
    margin-top: 4px;
  }
  .tag-input-row input {
    flex: 1;
    border: 1.5px solid #fbcfe8;
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 12px;
    outline: none;
    font-family: inherit;
  }
  .tag-input-row button {
    padding: 5px 10px;
    background: #ec4899;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }

  /* ── 우측 미리보기 영역 ── */
  .preview-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }
  .preview-label {
    font-size: 13px;
    color: #9ca3af;
    font-weight: 500;
    align-self: flex-start;
    padding-left: 4px;
  }
  .preview-scaler {
    width: 100%;
    overflow-x: auto;
  }

  /* ── 카드 본체 (미리보기 900×600 / 저장시 scale:2 → 1800×1200) ── */
  #card {
    width: 900px;
    height: 600px;
    position: relative;
    background: #fff;
    transform-origin: top left;
    overflow: hidden;
    font-family: 'Noto Sans KR', sans-serif;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }

  /* 상단 헤더 이미지 */
  #header-zone {
    width: 100%;
    height: 210px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #fce7f3 0%, #dbeafe 100%);
    cursor: crosshair;
  }
  #header-img {
    position: absolute;
    transform-origin: center center;
    will-change: transform;
    user-select: none;
  }
  #header-img.no-img {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #f9a8d4;
    letter-spacing: .05em;
  }
  .header-img-obj {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    pointer-events: none;
    transform-origin: center center;
  }

  /* 제작자 표기 */
  .credit {
    position: absolute;
    top: 10px;
    right: 18px;
    font-size: 13px;
    color: rgba(255,255,255,.75);
    z-index: 10;
    font-weight: 300;
    letter-spacing: .03em;
    text-shadow: 0 1px 4px rgba(0,0,0,.4);
  }

  /* ── 중간 섹션 ── */
  #mid-section {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    height: 170px;
    border-bottom: 2px solid #fbcfe8;
  }

  /* 좌측/우측 이미지 박스 */
  .side-img-box {
    width: 190px;
    min-width: 190px;
    position: relative;
    overflow: hidden;
    background: #fdf2f8;
    cursor: crosshair;
    border: 2px solid #fbcfe8;
  }
  .side-img-obj {
    position: absolute;
    object-fit: cover;
    transform-origin: center center;
    user-select: none;
    pointer-events: none;
  }
  .side-img-placeholder {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #f9a8d4;
    font-weight: 500;
    flex-direction: column;
    gap: 4px;
  }
  .side-img-placeholder span { font-size: 18px; }

  /* 보딩 패스 박스 */
  #boarding-box {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 16px;
    background: #fff9fb;
  }
  #boarding-pass {
    width: 100%;
    max-width: 420px;
    height: 130px;
    display: flex;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 16px var(--bp-shadow, rgba(236,72,153,.18));
    position: relative;
    border: 1.5px solid #fbcfe8;
    /* CSS 변수 기본값 */
    --bp-bg:     #ffffff;
    --bp-stripe: #fbcfe8;
    --bp-text:   #be185d;
    --bp-shadow: rgba(236,72,153,.18);
  }

  /* 보딩패스 좌측 스트라이프 — CSS 변수 사용 */
  .bp-stripe {
    width: 14px;
    background: repeating-linear-gradient(
      -45deg,
      var(--bp-stripe) 0px, var(--bp-stripe) 5px,
      var(--bp-bg)     5px, var(--bp-bg)     10px
    );
    flex-shrink: 0;
  }

  /* 보딩패스 중앙 내용 */
  .bp-body {
    flex: 1;
    padding: 9px 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    background: var(--bp-bg, #fff);
    position: relative;
  }
  .bp-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .2em;
    color: var(--bp-text, #be185d);
  }
  .bp-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    font-size: 6px;
  }
  .bp-field-label {
    color: #9ca3af;
    font-size: 6px;
    margin-bottom: 1px;
    font-weight: 500;
  }
  .bp-field-val {
    font-size: 7px;
    font-weight: 600;
    color: #374151;
    min-height: 8px;
  }

  /* 체크 항목들 */
  .bp-checks {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .bp-check-item {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-size: 6px;
    color: #9ca3af;
  }
  .bp-check-item.on { color: #ec4899; font-weight: 600; }
  .bp-check-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    border: 1px solid #d1d5db;
    background: transparent;
    flex-shrink: 0;
  }
  .bp-check-item.on .bp-check-dot {
    background: #ec4899;
    border-color: #ec4899;
  }

  /* 점선 구분선 */
  .bp-divider {
    width: 1px;
    background: repeating-linear-gradient(
      to bottom, var(--bp-stripe, #fbcfe8) 0px, var(--bp-stripe, #fbcfe8) 3px, transparent 3px, transparent 6px
    );
    flex-shrink: 0;
    margin: 0 4px;
  }

  /* 보딩패스 우측 (닉네임+배경이미지+인용구) */
  .bp-right {
    width: 150px;
    display: flex;
    flex-direction: column;
    background: var(--bp-bg, #fff);
    overflow: hidden;
  }
  .bp-right-top {
    padding: 8px 9px 5px;
  }
  .bp-nickname-area {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: nowrap;
    overflow: hidden;
  }
  .bp-nickname-text {
    font-weight: 700;
    color: #111827;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    font-size: 12px;
    transition: font-size .2s;
  }
  .bp-plane { color: var(--bp-text, #ec4899); font-size: 8px; flex-shrink: 0; }
  .bp-account {
    font-size: 7px;
    color: #6b7280;
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 배경 이미지 띠 */
  .bp-banner {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #fce7f3 0%, #ede9fe 50%, #dbeafe 100%);
    cursor: crosshair;
    min-height: 30px;
  }
  .bp-banner-img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform-origin: center center;
    user-select: none;
    pointer-events: none;
  }
  .bp-banner-placeholder {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7px;
    color: #c4b5fd;
    gap: 2px;
    letter-spacing: .03em;
  }
  .bp-banner:hover .bp-banner-edit {
    opacity: 1;
  }
  .bp-banner-edit {
    position: absolute;
    inset: 0;
    background: rgba(236,72,153,.12);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity .2s;
    z-index: 3;
    pointer-events: none;
  }
  .bp-banner-edit span {
    background: rgba(236,72,153,.8);
    color: #fff;
    padding: 2px 6px;
    border-radius: 10px;
    font-size: 6px;
    font-weight: 600;
  }

  .bp-right-bottom {
    padding: 5px 9px 7px;
  }
  .bp-quote {
    font-size: 6px;
    color: #4b5563;
    line-height: 1.6;
    font-style: italic;
    overflow-wrap: break-word;
    word-break: keep-all;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }



  /* ── 하단 세 박스 ── */
  #bottom-section {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    flex: 1;
  }
  .bottom-box {
    border: 2px solid #fbcfe8;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow: hidden;
  }
  .bottom-box:not(:last-child) {
    border-right: none;
  }

  .box-chip {
    display: inline-flex;
    align-items: center;
    padding: 3px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    align-self: flex-start;
  }

  .tag-display {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    line-height: 1.8;
  }
  .tag-display span {
    font-size: 13px;
    color: #374151;
    position: relative;
  }
  .tag-display span.active {
    background: linear-gradient(transparent 50%, #fde68a 50%);
    font-weight: 600;
    color: #111827;
  }

  /* ── 편집 오버레이 ── */
  .edit-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(236,72,153,.08);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    z-index: 5;
  }
  .side-img-box:hover .edit-overlay,
  #header-zone:hover .edit-overlay {
    opacity: 1;
  }
  .edit-overlay span {
    background: rgba(236,72,153,.8);
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  /* 이미지 드래그 커서 힌트 */
  .dragging-img { cursor: grabbing !important; }

  /* ── 슬라이더 (이미지 스케일) ── */
  .slider-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #6b7280;
  }
  .slider-wrap input[type="range"] {
    flex: 1;
    accent-color: #ec4899;
  }

  /* 미리보기 스케일 컨테이너 */
  #preview-container {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,.15);
  }
</style>
</head>
<body>

<div class="app-wrap">
  <!-- ═══════════════════════════════════════
       좌측 컨트롤 패널
  ═══════════════════════════════════════ -->
  <div class="panel">
    <h2>✦ 카드 편집기</h2>

    <!-- 폰트 선택 -->
    <div class="panel-section">
      <label>폰트</label>
      <select class="font-select" id="fontSelect" onchange="applyFont()">
        <option value="'Noto Sans KR', sans-serif">Noto Sans Korean</option>
        <option value="'Nanum Myeongjo', serif">Nanum Myeongjo</option>
        <option value="'Gowun Dodum', sans-serif">Gowun Dodum</option>
        <option value="'Hahmlet', serif">Hahmlet</option>
      </select>
    </div>

    <!-- 헤더 이미지 -->
    <div class="panel-section">
      <label>상단 헤더 이미지</label>
      <button class="upload-btn" onclick="document.getElementById('headerImgInput').click()">
        📷 헤더 이미지 업로드
      </button>
      <input type="file" id="headerImgInput" accept="image/*" style="display:none" onchange="uploadHeader(event)">
      <div class="slider-wrap">
        <span>크기</span>
        <input type="range" id="headerScale" min="50" max="300" value="100" oninput="updateHeaderTransform()">
        <span id="headerScaleVal">100%</span>
      </div>
    </div>

    <!-- 중앙 좌/우 이미지 -->
    <div class="panel-section">
      <label>중앙 좌측 이미지</label>
      <button class="upload-btn" onclick="document.getElementById('leftImgInput').click()">
        📷 좌측 이미지 업로드
      </button>
      <input type="file" id="leftImgInput" accept="image/*" style="display:none" onchange="uploadSide(event,'left')">
      <div class="slider-wrap">
        <span>크기</span>
        <input type="range" id="leftScale" min="10" max="300" value="100" oninput="updateSideTransform('left')">
        <span id="leftScaleVal">100%</span>
      </div>
    </div>
    <div class="panel-section">
      <label>중앙 우측 이미지</label>
      <button class="upload-btn" onclick="document.getElementById('rightImgInput').click()">
        📷 우측 이미지 업로드
      </button>
      <input type="file" id="rightImgInput" accept="image/*" style="display:none" onchange="uploadSide(event,'right')">
      <div class="slider-wrap">
        <span>크기</span>
        <input type="range" id="rightScale" min="10" max="300" value="100" oninput="updateSideTransform('right')">
        <span id="rightScaleVal">100%</span>
      </div>
    </div>

    <!-- 보딩패스 배너 이미지 -->
    <div class="panel-section">
      <label>보딩패스 배경 이미지</label>
      <button class="upload-btn" onclick="document.getElementById('bannerImgInput').click()">
        🖼 배너 이미지 업로드
      </button>
      <input type="file" id="bannerImgInput" accept="image/*" style="display:none" onchange="uploadBanner(event)">
      <div class="slider-wrap">
        <span>크기</span>
        <input type="range" id="bannerScale" min="10" max="300" value="100" oninput="updateBannerTransform()">
        <span id="bannerScaleVal">100%</span>
      </div>
    </div>

    <!-- 닉네임 / 계정 -->
    <div class="panel-section">
      <label>닉네임</label>
      <input type="text" id="nicknameInput" placeholder="닉네임" oninput="updateBP()" maxlength="30">
    </div>
    <div class="panel-section">
      <label>계정</label>
      <input type="text" id="accountInput" placeholder="@계정명" oninput="updateBP()" maxlength="30">
    </div>
    <div class="panel-section">
      <label>인용구</label>
      <textarea id="quoteInput" rows="3" placeholder="인용구를 입력하세요" oninput="updateBP()"></textarea>
      <div class="slider-wrap">
        <span>글자 크기</span>
        <input type="range" id="quoteSize" min="4" max="16" value="6" oninput="updateQuoteSize()">
        <span id="quoteSizeVal">6px</span>
      </div>
    </div>

    <!-- 연령 -->
    <div class="panel-section">
      <label>연령</label>
      <div class="radio-group" id="ageGroup">

                    <div class="bp-nickname-area">
                      <span class="bp-nickname-text" id="bpNickname">닉네임</span>
                      <span class="bp-plane">✈</span>
                      <span class="bp-account" id="bpAccount">계정</span>
                    </div>
                  </div>
                  <!-- 배경 이미지 띠 -->
                  <div class="bp-banner" id="bpBannerZone">
                    <div class="bp-banner-placeholder" id="bpBannerPlaceholder">🖼 배경 이미지 추가</div>
                    <img id="bp-banner-img" class="bp-banner-img" style="display:none;" draggable="false" alt="">
                    <div class="bp-banner-edit"><span>드래그로 위치 조절</span></div>
                  </div>
                  <div class="bp-right-bottom">
                    <div class="bp-quote" id="bpQuote">인용구 입력란</div>
                  </div>
                </div>
                <div class="bp-stripe"></div>
              </div>
            </div><!-- /boarding-box -->

            <!-- 우측 이미지 -->
            <div class="side-img-box" id="rightImgBox">
              <div class="side-img-placeholder" id="rightPlaceholder">
                <span>📷</span>우측 이미지
              </div>
              <img id="right-img-el" class="side-img-obj" style="display:none;width:100%;height:100%;" draggable="false" alt="">
              <div class="edit-overlay"><span>드래그로 위치 조절</span></div>
            </div>

          </div><!-- /mid-section -->

          <!-- 하단 세 박스 -->
          <div id="bottom-section">

            <!-- 박스1: 트윗성향 / 플레이 / CP -->
            <div class="bottom-box" id="box1">
              <div class="box-chip" id="chip1" style="background:#ec4899;">트윗 성향</div>
              <div class="tag-display" id="tweetDisplay"></div>
              <div class="box-chip" id="chip1b" style="background:#ec4899;">플레이</div>
              <div class="tag-display" id="playDisplay"></div>
              <div class="box-chip" id="chip1c" style="background:#ec4899;">CP</div>
              <div class="tag-display" id="cpDisplay"></div>
            </div>

            <!-- 박스2: 플랫폼 + 자기소개 -->
            <div class="bottom-box" id="box2">
              <div class="box-chip" id="chip2" style="background:#ec4899;">플랫폼</div>
              <div class="tag-display" id="platformDisplay"></div>
              <div style="margin-top:8px;font-size:13px;color:#6b7280;line-height:1.7;" id="introDisplay">
                간단한 자기 소개 글 적을 수 있는 항목.
              </div>
              <textarea id="introInput" rows="4" placeholder="자기소개를 입력하세요"
                style="margin-top:8px;border:1.5px solid #fbcfe8;border-radius:8px;padding:8px;font-size:13px;font-family:inherit;width:100%;resize:none;outline:none;display:none;"
                oninput="document.getElementById('introDisplay').textContent=this.value||'간단한 자기 소개 글 적을 수 있는 항목.'"></textarea>
            </div>

            <!-- 박스3: 선호태그 -->
            <div class="bottom-box" id="box3">
              <div class="box-chip" id="chip3" style="background:#ec4899;">선호 태그</div>
              <div class="tag-display" id="tagDisplay"></div>
            </div>

          </div><!-- /bottom-section -->

        </div><!-- /#card -->
      </div><!-- /#preview-container -->
    </div><!-- /.preview-scaler -->
    <!-- 자기소개 입력란 (미리보기 아래) -->
    <div style="width:100%;background:#fff;border-radius:10px;padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-top:4px;">
      <label style="font-size:12px;font-weight:600;color:#6b7280;display:block;margin-bottom:6px;">자기소개 (박스2 하단)</label>
      <textarea id="introInputPanel" rows="3" placeholder="자기소개를 입력하세요"
        style="width:100%;border:1.5px solid #fbcfe8;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical;outline:none;"
        oninput="document.getElementById('introDisplay').textContent=this.value||'간단한 자기 소개 글 적을 수 있는 항목.'"></textarea>
    </div>
  </div>
</div>

<script>
// ── 전역 상태 ──────────────────────────────────
const imgState = {
  header: { x:0, y:0, scale:100 },
  left:   { x:0, y:0, scale:100 },
  right:  { x:0, y:0, scale:100 },
  banner: { x:0, y:0, scale:100 },
};

// ── 미리보기 스케일 ──────────────────────────────
function scalePreview() {
  const card      = document.getElementById('card');
  const container = document.getElementById('preview-container');
  const wrap      = document.querySelector('.preview-scaler');
  const avail     = wrap.clientWidth - 4;
  const s         = Math.min(1, avail / 900);
  card.style.transform       = `scale(${s})`;
  card.style.transformOrigin = 'top left';
  container.style.width      = Math.round(900 * s) + 'px';
  container.style.height     = Math.round(600 * s) + 'px';
}
window.addEventListener('resize', scalePreview);
window.addEventListener('load',   scalePreview);
setTimeout(scalePreview, 100);

function getCardScale() {
  const t = document.getElementById('card').style.transform || '';
  const m = t.match(/scale\(([^)]+)\)/);
  return m ? parseFloat(m[1]) : 1;
}

// ── 이미지 드래그 ──────────────────────────────
function setupDrag(zoneId, imgId, stateKey, updateFn) {
  const zone = document.getElementById(zoneId);
  if (!zone) return;
  let active = false, sx, sy, ox, oy;

  zone.addEventListener('mousedown', e => {
    const img = document.getElementById(imgId);
    if (!img || img.style.display === 'none') return;
    e.preventDefault();
    active = true;
    sx = e.clientX; sy = e.clientY;
    ox = imgState[stateKey].x; oy = imgState[stateKey].y;
    zone.style.cursor = 'grabbing';
  });
  window.addEventListener('mousemove', e => {
    if (!active) return;
    const s = getCardScale();
    imgState[stateKey].x = ox + (e.clientX - sx) / s;
    imgState[stateKey].y = oy + (e.clientY - sy) / s;
    updateFn();
  });
  window.addEventListener('mouseup', () => {
    active = false;
    zone.style.cursor = 'crosshair';
  });
  zone.addEventListener('touchstart', e => {
    const img = document.getElementById(imgId);
    if (!img || img.style.display === 'none') return;
    e.preventDefault();
    active = true;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    ox = imgState[stateKey].x; oy = imgState[stateKey].y;
  }, { passive: false });
  window.addEventListener('touchmove', e => {
    if (!active) return;
    e.preventDefault();
    const s = getCardScale();
    imgState[stateKey].x = ox + (e.touches[0].clientX - sx) / s;
    imgState[stateKey].y = oy + (e.touches[0].clientY - sy) / s;
    updateFn();
  }, { passive: false });
  window.addEventListener('touchend', () => { active = false; });
}

// ── 이미지 transform 적용 ──────────────────────
function applyImgTransform(imgEl, stateKey) {
  const { x, y, scale } = imgState[stateKey];
  imgEl.style.transform       = `translate(${x}px, ${y}px) scale(${scale / 100})`;
  imgEl.style.transformOrigin = 'top left';
  imgEl.style.position        = 'absolute';
  imgEl.style.top             = '0';
  imgEl.style.left            = '0';
  imgEl.style.maxWidth        = 'none';
  imgEl.style.maxHeight       = 'none';
}

// ── 헤더 이미지 ────────────────────────────────
function uploadHeader(e) {
  const file = e.target.files[0]; if (!file) return;
  const img = document.getElementById('header-img-el');
  img.onload = () => {
    img.style.width  = img.naturalWidth  + 'px';
    img.style.height = img.naturalHeight + 'px';
    img.style.display = 'block';
    document.getElementById('header-no-img').style.display = 'none';
    imgState.header = { x: 0, y: 0, scale: 100 };
    document.getElementById('headerScale').value = 100;
    document.getElementById('headerScaleVal').textContent = '100%';
    applyImgTransform(img, 'header');
  };
  img.src = URL.createObjectURL(file);
}
function updateHeaderTransform() {
  const sc = parseInt(document.getElementById('headerScale').value);
  document.getElementById('headerScaleVal').textContent = sc + '%';
  imgState.header.scale = sc;
  applyImgTransform(document.getElementById('header-img-el'), 'header');
}
setupDrag('header-zone', 'header-img-el', 'header', () => applyImgTransform(document.getElementById('header-img-el'), 'header'));

// ── 사이드 이미지 ──────────────────────────────
function uploadSide(e, side) {
  const file = e.target.files[0]; if (!file) return;
  const imgId  = side === 'left' ? 'left-img-el'    : 'right-img-el';
  const phId   = side === 'left' ? 'leftPlaceholder' : 'rightPlaceholder';
  const imgEl  = document.getElementById(imgId);
  imgEl.onload = () => {
    imgEl.style.width  = imgEl.naturalWidth  + 'px';
    imgEl.style.height = imgEl.naturalHeight + 'px';
    imgEl.style.display = 'block';
    document.getElementById(phId).style.display = 'none';
    imgState[side] = { x: 0, y: 0, scale: 100 };
    const scId  = side === 'left' ? 'leftScale'    : 'rightScale';
    const valId = side === 'left' ? 'leftScaleVal'  : 'rightScaleVal';
    document.getElementById(scId).value = 100;
    document.getElementById(valId).textContent = '100%';
    applyImgTransform(imgEl, side);
  };
  imgEl.src = URL.createObjectURL(file);
}
function updateSideTransform(side) {
  const scId  = side === 'left' ? 'leftScale'   : 'rightScale';
  const valId = side === 'left' ? 'leftScaleVal' : 'rightScaleVal';
  const imgId = side === 'left' ? 'left-img-el'  : 'right-img-el';
  const sc    = parseInt(document.getElementById(scId).value);
  document.getElementById(valId).textContent = sc + '%';
  imgState[side].scale = sc;
  applyImgTransform(document.getElementById(imgId), side);
}
setupDrag('leftImgBox',  'left-img-el',  'left',  () => applyImgTransform(document.getElementById('left-img-el'),  'left'));
setupDrag('rightImgBox', 'right-img-el', 'right', () => applyImgTransform(document.getElementById('right-img-el'), 'right'));

// ── 배너 이미지 ────────────────────────────────
function uploadBanner(e) {
  const file = e.target.files[0]; if (!file) return;
  const img = document.getElementById('bp-banner-img');
  img.onload = () => {
    img.style.width  = img.naturalWidth  + 'px';
    img.style.height = img.naturalHeight + 'px';
    img.style.display = 'block';
    document.getElementById('bpBannerPlaceholder').style.display = 'none';
    imgState.banner = { x: 0, y: 0, scale: 100 };
    document.getElementById('bannerScale').value = 100;
    document.getElementById('bannerScaleVal').textContent = '100%';
    applyImgTransform(img, 'banner');
  };
  img.src = URL.createObjectURL(file);
}
function updateBannerTransform() {
  const sc = parseInt(document.getElementById('bannerScale').value);
  document.getElementById('bannerScaleVal').textContent = sc + '%';
  imgState.banner.scale = sc;
  applyImgTransform(document.getElementById('bp-banner-img'), 'banner');
}
setupDrag('bpBannerZone', 'bp-banner-img', 'banner', () => applyImgTransform(document.getElementById('bp-banner-img'), 'banner'));

// ── 체크 그룹 ──────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const checkGroups = ['tweetGroup','playGroup','cpGroup','platformGroup','tagGroup','relGroup'];
  checkGroups.forEach(groupId => {
    const group = document.getElementById(groupId);
    if (!group) return;
    group.addEventListener('change', e => {
      if (e.target.type !== 'checkbox') return;
      const lbl = e.target.closest('label.check-item');
      if (!lbl) return;
      lbl.classList.toggle('checked', e.target.checked);
      renderDisplay(groupId);
    });
  });
  // 초기 렌더
  ['tweetGroup','playGroup','cpGroup','platformGroup','tagGroup'].forEach(renderDisplay);
});

function renderDisplay(groupId) {
  if (groupId === 'relGroup') {
    const vals = [...document.querySelectorAll('#relGroup .check-item.checked')]
      .map(l => l.querySelector('input').value);
    document.getElementById('bpRel').textContent = vals.join(' / ') || '—';
    return;
  }
  const map = {
    tweetGroup: 'tweetDisplay', playGroup: 'playDisplay',
    cpGroup: 'cpDisplay', platformGroup: 'platformDisplay', tagGroup: 'tagDisplay'
  };
  const dispEl = document.getElementById(map[groupId]);
  if (!dispEl) return;
  dispEl.innerHTML = '';
  document.querySelectorAll(`#${groupId} .check-item`).forEach(lbl => {
    const sp = document.createElement('span');
    sp.textContent = lbl.querySelector('input').value;
    if (lbl.classList.contains('checked')) sp.classList.add('active');
    dispEl.appendChild(sp);
    dispEl.appendChild(document.createTextNode(' '));
  });
  refreshHlStyle();
}

function addCustomTag(groupId, inputId) {
  const inp = document.getElementById(inputId);
  const val = inp.value.trim(); if (!val) return;
  const lbl = document.createElement('label');
  lbl.className = 'check-item checked';
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.value = val; cb.checked = true;
  lbl.appendChild(cb);
  lbl.appendChild(document.createTextNode(val));
  document.getElementById(groupId).appendChild(lbl);
  inp.value = '';
  renderDisplay(groupId);
}

// ── 보딩패스 텍스트 ────────────────────────────
function updateBP() {
  const nn = document.getElementById('nicknameInput').value || '닉네임';
  const ac = document.getElementById('accountInput').value  || '계정';
  const qt = document.getElementById('quoteInput').value    || '인용구 입력란';
  const mn = document.getElementById('mineInput').value     || '—';
  const bpNN = document.getElementById('bpNickname');
  bpNN.textContent = nn;
  bpNN.style.fontSize = nn.length <= 6 ? '13px' : nn.length <= 10 ? '10px' : '8px';
  document.getElementById('bpAccount').textContent = ac;
  document.getElementById('bpQuote').textContent   = qt;
  document.getElementById('bpMine').textContent    = mn;
}

// ── 인용구 폰트 사이즈 ────────────────────────
function updateQuoteSize() {
  const sz = document.getElementById('quoteSize').value;
  document.getElementById('quoteSizeVal').textContent = sz + 'px';
  document.getElementById('bpQuote').style.fontSize   = sz + 'px';
}

// ── 라디오 ─────────────────────────────────────
function selectRadio(el, groupId) {
  document.querySelectorAll(`#${groupId} .radio-item`).forEach(r => r.classList.remove('checked'));
  el.classList.add('checked');
  const val = el.querySelector('input').value;
  if (groupId === 'ageGroup') document.getElementById('bpAge').textContent = val;
  if (groupId === 'fubGroup') document.getElementById('bpFub').textContent = val;
}

// ── 폰트 ───────────────────────────────────────
function applyFont() {
  document.getElementById('card').style.fontFamily = document.getElementById('fontSelect').value;
}

// ── 색상 ───────────────────────────────────────
function setColor(id, val) {
  document.getElementById(id).value = val;
  if      (id.startsWith('chip'))        applyChipColors();
  else if (id === 'highlightColor')      refreshHlStyle();
  else if (['bpBgColor','bpStripeColor','bpTextColor','bpShadowColor'].includes(id)) applyBpColors();
  else                                   applyColors();
}

function applyBpColors() {
  const bg     = document.getElementById('bpBgColor').value;
  const stripe = document.getElementById('bpStripeColor').value;
  const text   = document.getElementById('bpTextColor').value;
  const shadow = document.getElementById('bpShadowColor').value;

  // hex → rgba 변환 (알파 0.5 고정)
  const h2r = hex => {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},0.45)`;
  };

  const bp = document.getElementById('boarding-pass');
  bp.style.setProperty('--bp-bg',     bg);
  bp.style.setProperty('--bp-stripe', stripe);
  bp.style.setProperty('--bp-text',   text);
  bp.style.setProperty('--bp-shadow', h2r(shadow));
  bp.style.boxShadow = `0 4px 16px ${h2r(shadow)}`;
}
function applyColors() {
  const border = document.getElementById('borderColor').value;
  const midBg  = document.getElementById('midBg').value;
  const botBg  = document.getElementById('bottomBg').value;
  document.querySelectorAll('.bottom-box').forEach(b => {
    b.style.background  = botBg;
    b.style.borderColor = border;
  });
  document.getElementById('boarding-box').style.background      = midBg;
  document.getElementById('boarding-pass').style.borderColor    = border;
  document.getElementById('mid-section').style.borderColor      = border;
  document.querySelectorAll('.side-img-box').forEach(b => b.style.borderColor = border);
}
function applyChipColors() {
  const c1 = document.getElementById('chip1Color').value;
  const c2 = document.getElementById('chip2Color').value;
  const c3 = document.getElementById('chip3Color').value;
  ['chip1','chip1b','chip1c'].forEach(id => { const el = document.getElementById(id); if(el) el.style.background = c1; });
  const e2 = document.getElementById('chip2'); if(e2) e2.style.background = c2;
  const e3 = document.getElementById('chip3'); if(e3) e3.style.background = c3;
}
const _hlStyle = document.createElement('style');
document.head.appendChild(_hlStyle);
function refreshHlStyle() {
  const hc = document.getElementById('highlightColor').value;
  _hlStyle.textContent = `.tag-display span.active{background-image:linear-gradient(transparent 50%,${hc} 50%)!important;}`;
}
document.getElementById('highlightColor').addEventListener('input', refreshHlStyle);
refreshHlStyle();

// ── 저장 ───────────────────────────────────────
async function saveCard() {
  const btn = document.querySelector('.save-btn');
  btn.textContent = '⏳ 저장 중...'; btn.disabled = true;
  const card      = document.getElementById('card');
  const container = document.getElementById('preview-container');
  const orig      = card.style.transform;
  card.style.transform      = 'none';
  container.style.overflow  = 'visible';
  try {
    const canvas = await html2canvas(card, { scale:2, width:900, height:600, useCORS:true, allowTaint:true, logging:false });
    const a = document.createElement('a');
    a.download = '보름보름둥근달이떴어요.png';
    a.href = canvas.toDataURL('image/png', 1.0);
    a.click();
  } catch(err) { alert('저장 오류: ' + err.message); }
  card.style.transform     = orig;
  container.style.overflow = 'hidden';
  btn.textContent = '💾 이미지로 저장 (1800×1200)'; btn.disabled = false;
}
</script>
</body>
