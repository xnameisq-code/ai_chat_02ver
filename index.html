<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 생성기</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Jua&family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    
    <style>
        :root {
            --font-family: 'Noto Sans KR', sans-serif;
            --center-color: #ffccda;
            --bottom-color: #ffb6c1;
            --shape-color: #a2b9d4;
            --highlight-color: #fff0f5;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            height: 100vh;
            background-color: #f5f6fa;
            overflow: hidden;
        }

        /* 왼쪽 컨트롤 패널 */
        .sidebar {
            width: 400px;
            background-color: #ffffff;
            border-right: 1px solid #ddd;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .sidebar h2 { font-size: 18px; margin-top: 0; padding-bottom: 10px; border-bottom: 2px solid #ffb6c1; }
        .control-group { margin-bottom: 20px; border-bottom: 1px dashed #eee; padding-bottom: 15px; }
        .control-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .control-group input[type="text"], .control-group select, .control-group textarea {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 5px; font-family: inherit;
        }
        .control-group input[type="color"] { width: 100%; height: 40px; border: none; cursor: pointer; }
        
        .checkbox-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .checkbox-grid label { display: flex; align-items: center; font-weight: normal; font-size: 13px; margin: 0; cursor: pointer; }
        .checkbox-grid input[type="checkbox"], .checkbox-grid input[type="radio"] { margin-right: 4px; }

        details { background: #f9f9f9; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #eee; }
        summary { font-weight: bold; cursor: pointer; margin-bottom: 10px; outline: none; }

        .btn-add { background: var(--bottom-color); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-save { background: #2f3640; color: white; border: none; padding: 15px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 20px; }

        /* 오른쪽 프리뷰 영역 */
        .preview-wrapper {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e0e0e0;
            padding: 20px;
        }

        #zoom-container {
            transform-origin: center center;
            transition: transform 0.2s;
        }

        /* 메인 캔버스 1800x1200 */
        .canvas {
            width: 1800px;
            height: 1200px;
            background-color: #ffffff;
            position: relative;
            box-sizing: border-box;
            padding: 30px;
            font-family: var(--font-family);
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .watermark { position: absolute; top: 15px; right: 30px; font-size: 16px; color: #666; font-weight: bold; z-index: 5; text-shadow: 1px 1px 2px white; }

        /* 드래그 가능 배경 */
        .drag-bg {
            background-size: cover;
            background-repeat: no-repeat;
            cursor: grab;
            background-color: #f0f0f0;
            position: relative;
        }
        .drag-bg:active { cursor: grabbing; }
        .drag-bg::after { content: '클릭하여 이미지 위치 조정'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #aaa; font-size: 14px; pointer-events: none; opacity: 0.8; }
        .drag-bg.has-image::after { display: none; }

        /* 상단 헤더 */
        .header-section { width: 100%; height: 350px; border-radius: 10px; overflow: hidden; }
        
        /* 중앙 박스 영역 */
        .middle-section { display: flex; width: 100%; height: 320px; gap: 30px; justify-content: space-between; }
        .side-img { width: 400px; height: 100%; border-radius: 20px; overflow: hidden; }
        
        /* 보딩 패스 디자인 */
        .boarding-pass-wrap {
            flex: 1;
            background: repeating-linear-gradient(45deg, var(--center-color), var(--center-color) 15px, #ffffff 15px, #ffffff 30px);
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
        }
        .boarding-pass-inner { background: #fff; width: 100%; height: 100%; border-radius: 5px; display: flex; box-shadow: 0 4px 8px rgba(0,0,0,0.1); overflow: hidden; }
        .barcode { width: 60px; height: 100%; background: repeating-linear-gradient(180deg, var(--center-color) 0, var(--center-color) 2px, transparent 2px, transparent 5px, var(--center-color) 5px, var(--center-color) 9px, transparent 9px, transparent 12px); border-right: 1px solid #eee; }
        .bp-content { flex: 1; padding: 25px; display: flex; flex-direction: column; }
        .bp-title { font-size: 32px; font-weight: bold; letter-spacing: 2px; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .bp-body { display: flex; flex: 1; gap: 40px; }
        .bp-info-list { width: 300px; font-size: 16px; line-height: 1.8; }
        .bp-info-item { margin-bottom: 15px; }
        .bp-label { font-size: 12px; font-weight: bold; color: #555; display: block; margin-bottom: 2px; }
        .bp-val { font-weight: bold; }
        .bp-main-names { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .names-row { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 20px; }
        .name-box-container { width: 40%; height: 60px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .name-box { font-weight: bold; white-space: nowrap; }
        .plane-icon { font-size: 40px; color: var(--bottom-color); transform: rotate(45deg); }
        .quote-container { width: 100%; flex: 1; border-top: 1px dashed #ccc; padding-top: 15px; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
        .quote-box { font-size: 24px; font-weight: bold; white-space: nowrap; }

        /* 하단 박스 영역 */
        .bottom-section {
            width: 100%; flex: 1;
            background-color: var(--bottom-color);
            padding: 15px;
            border-radius: 10px;
            box-sizing: border-box;
            display: flex;
        }
        .bottom-inner { width: 100%; height: 100%; background: #ffffff; border-radius: 5px; display: flex; padding: 25px; gap: 30px; box-sizing: border-box; }
        .col { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .col-title { 
            background-color: var(--shape-color); color: #fff; padding: 8px 20px; border-radius: 30px; 
            font-size: 20px; font-weight: bold; display: inline-block; width: max-content; margin-bottom: 10px; text-shadow: 1px 1px 1px rgba(0,0,0,0.2);
        }
        .tag-list { font-size: 18px; line-height: 1.8; word-break: keep-all; }
        .highlight { background: linear-gradient(to top, var(--bottom-color) 40%, transparent 40%); font-weight: bold; }
        .intro-box { border-top: 2px solid #eee; margin-top: 15px; padding-top: 15px; flex: 1; font-size: 18px; white-space: pre-wrap; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🎨 프로필 설정</h2>
        
        <button class="btn-save" onclick="saveImage()">이미지 저장하기</button>

        <div class="control-group" style="margin-top: 20px;">
            <label>폰트 선택</label>
            <select id="font-select" onchange="updateStyles()">
                <option value="'Noto Sans KR'">Noto Sans KR (기본고딕)</option>
                <option value="'Nanum Gothic'">나눔고딕</option>
                <option value="'Jua'">주아체 (동글동글)</option>
                <option value="'Do Hyeon'">도현체 (반듯한)</option>
                <option value="'IBM Plex Sans KR'">IBM Plex Sans KR</option>
            </select>
        </div>

        <div class="control-group">
            <label>컬러 팔레트</label>
            <div style="display:flex; gap:10px;">
                <div>
                    <label style="font-size:12px; font-weight:normal;">중앙 박스</label>
                    <input type="color" id="color-center" value="#ffccda" onchange="updateStyles()">
                </div>
                <div>
                    <label style="font-size:12px; font-weight:normal;">하단 배경</label>
                    <input type="color" id="color-bottom" value="#ffb6c1" onchange="updateStyles()">
                </div>
                <div>
                    <label style="font-size:12px; font-weight:normal;">도형 색상</label>
                    <input type="color" id="color-shape" value="#a2b9d4" onchange="updateStyles()">
                </div>
            </div>
        </div>

        <div class="control-group">
            <label>이미지 업로드 (드래그하여 위치 조절)</label>
            <label style="font-size:12px; font-weight:normal;">상단 헤더</label>
            <input type="file" id="upload-header" accept="image/*">
            <label style="font-size:12px; font-weight:normal; margin-top:10px;">중앙 좌측 이미지</label>
            <input type="file" id="upload-left" accept="image/*">
            <label style="font-size:12px; font-weight:normal; margin-top:10px;">중앙 우측 이미지</label>
            <input type="file" id="upload-right" accept="image/*">
        </div>

        <div class="control-group">
            <label>보딩 패스 정보 (중앙)</label>
            <input type="text" id="input-nickname" placeholder="닉네임" oninput="updateText('nickname-box', this.value)">
            <input type="text" id="input-account" placeholder="계정 (@아이디)" oninput="updateText('account-box', this.value)">
            <input type="text" id="input-quote" placeholder="인용구 입력란" oninput="updateText('quote-box', this.value)">
            
            <div style="margin-top:10px;">
                <label style="font-size:12px;">연령</label>
                <div class="checkbox-grid" id="opt-age">
                    <label><input type="radio" name="age" value="성인" checked onchange="updateBoardingPass()"> 성인</label>
                    <label><input type="radio" name="age" value="미성년자" onchange="updateBoardingPass()"> 미성년자</label>
                    <label><input type="radio" name="age" value="비공개" onchange="updateBoardingPass()"> 비공개</label>
                </div>
            </div>
            <div style="margin-top:10px;">
                <label style="font-size:12px;">FUB FREE</label>
                <div class="checkbox-grid" id="opt-fub">
                    <label><input type="radio" name="fub" value="O" checked onchange="updateBoardingPass()"> O</label>
                    <label><input type="radio" name="fub" value="X" onchange="updateBoardingPass()"> X</label>
                </div>
            </div>
            <div style="margin-top:10px;">
                <label style="font-size:12px;">관계정리</label>
                <div class="checkbox-grid" id="opt-rel">
                    <label><input type="radio" name="rel" value="블락" checked onchange="updateBoardingPass()"> 블락</label>
                    <label><input type="radio" name="rel" value="언블" onchange="updateBoardingPass()"> 언블</label>
                    <label><input type="radio" name="rel" value="맘관블" onchange="updateBoardingPass()"> 맘관블</label>
                </div>
            </div>
            <div style="margin-top:10px;">
                <label style="font-size:12px;">지뢰</label>
                <input type="text" id="input-mine" placeholder="지뢰 항목 입력" oninput="document.getElementById('bp-mine-val').innerText = this.value || '없음'">
            </div>
        </div>

        <div class="control-group">
            <label>트윗 성향 (다중 선택)</label>
            <div class="checkbox-grid" id="list-tweet"></div>
        </div>

        <div class="control-group">
            <label>플레이 (다중 선택)</label>
            <div class="checkbox-grid" id="list-play"></div>
        </div>

        <div class="control-group">
            <label>CP (다중 선택)</label>
            <div class="checkbox-grid" id="list-cp"></div>
        </div>

        <div class="control-group">
            <details>
                <summary>플랫폼 항목 (접기/펴기)</summary>
                <div class="checkbox-grid" id="list-platform"></div>
                <div style="margin-top: 10px; display:flex; gap:5px;">
                    <input type="text" id="custom-platform" placeholder="직접 입력 추가">
                    <button class="btn-add" onclick="addCustomItem('platform')">추가</button>
                </div>
            </details>
        </div>
        
        <div class="control-group">
            <label>자기 소개</label>
            <textarea id="input-intro" rows="3" placeholder="간단한 자기 소개 글 적을 수 있는 항목" oninput="document.getElementById('canvas-intro').innerText = this.value"></textarea>
        </div>

        <div class="control-group">
            <details open>
                <summary>선호 태그 항목 (접기/펴기)</summary>
                <div class="checkbox-grid" id="list-tags"></div>
                <div style="margin-top: 10px; display:flex; gap:5px;">
                    <input type="text" id="custom-tag" placeholder="직접 입력 추가">
                    <button class="btn-add" onclick="addCustomItem('tags')">추가</button>
                </div>
            </details>
        </div>
        <br><br><br>
    </div>

    <div class="preview-wrapper">
        <div id="zoom-container">
            <div class="canvas" id="canvas">
                <div class="watermark">제작자 보름(@2L00D4)</div>
                
                <div class="header-section drag-bg" id="bg-header"></div>
                
                <div class="middle-section">
                    <div class="side-img drag-bg" id="bg-left"></div>
                    <div class="boarding-pass-wrap">
                        <div class="boarding-pass-inner">
                            <div class="barcode"></div>
                            <div class="bp-content">
                                <div class="bp-title">BOARDING PASS</div>
                                <div class="bp-body">
                                    <div class="bp-info-list">
                                        <div class="bp-info-item"><span class="bp-label">연령</span><span class="bp-val" id="bp-age-val"></span></div>
                                        <div class="bp-info-item"><span class="bp-label">FUB FREE</span><span class="bp-val" id="bp-fub-val"></span></div>
                                        <div class="bp-info-item"><span class="bp-label">관계정리</span><span class="bp-val" id="bp-rel-val"></span></div>
                                        <div class="bp-info-item"><span class="bp-label">지뢰</span><span class="bp-val" id="bp-mine-val">입력 안됨</span></div>
                                    </div>
                                    <div class="bp-main-names">
                                        <div class="names-row">
                                            <div class="name-box-container"><div class="name-box" id="nickname-box">닉네임</div></div>
                                            <div class="plane-icon">✈</div>
                                            <div class="name-box-container"><div class="name-box" id="account-box">계정</div></div>
                                        </div>
                                        <div class="quote-container">
                                            <div class="quote-box" id="quote-box">인용구 입력란</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="side-img drag-bg" id="bg-right"></div>
                </div>

                <div class="bottom-section">
                    <div class="bottom-inner">
                        <div class="col">
                            <div><div class="col-title">트윗 성향</div><div class="tag-list" id="canvas-tweet"></div></div>
                            <div><div class="col-title">플레이</div><div class="tag-list" id="canvas-play"></div></div>
                            <div><div class="col-title">CP</div><div class="tag-list" id="canvas-cp"></div></div>
                        </div>
                        <div class="col">
                            <div><div class="col-title">플랫폼</div><div class="tag-list" id="canvas-platform"></div></div>
                            <div class="intro-box" id="canvas-intro">간단한 자기 소개 글 적을 수 있는 항목.</div>
                        </div>
                        <div class="col">
                            <div><div class="col-title">선호 태그</div><div class="tag-list" id="canvas-tags"></div></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 데이터 리스트
        const dataLists = {
            tweet: ["일상", "RT", "인용", "마음", "로그", "글", "그림", "탐라대화", "앓이", "OOC 및 프롬프트 배포", "드림"],
            play: ["제작", "소비", "OOC", "그 외"],
            cp: ["HL", "BL", "GL", "NCP", "ALL", "리버시블", "논리버시블", "다인", "OPEN", "CBC", "ONLY"],
            platform: ["케이브덕", "로판", "제타", "크랙", "블룸", "잉크챗", "멜팅", "위프", "플레이툰"],
            tags: ["다인", "시뮬", "탑/깁", "바텀/텍", "동정", "장발", "퍼리", "피어싱", "수인", "동물", "인외", "현대", "서양풍", "동양풍", "히어로", "센티넬버스", "네임버스", "오메가버스", "능글", "햇살", "빌런", "까칠", "무뚝뚝", "유명인", "도미넌트", "서브미시브", "BDSM", "군인", "동화", "코미디", "로코", "무협", "로맨스", "조폭", "근친", "짭근친", "쓰레기", "욕망", "중년", "소유욕", "집착", "순애", "NTR", "NTL", "애증", "구원", "노란장판", "연인", "부부", "동갑", "연상", "연하"]
        };

        const customData = { platform: [], tags: [] };

        // 초기화
        window.onload = () => {
            initCheckboxes('tweet'); initCheckboxes('play'); initCheckboxes('cp');
            initCheckboxes('platform'); initCheckboxes('tags');
            updateBoardingPass();
            scaleCanvas();
            window.addEventListener('resize', scaleCanvas);
            
            setupImageUpload('upload-header', 'bg-header');
            setupImageUpload('upload-left', 'bg-left');
            setupImageUpload('upload-right', 'bg-right');
        };

        // 줌(스케일) 자동 조절
        function scaleCanvas() {
            const wrapper = document.querySelector('.preview-wrapper');
            const container = document.getElementById('zoom-container');
            const scale = Math.min(wrapper.clientWidth / 1860, wrapper.clientHeight / 1260, 1);
            container.style.transform = `scale(${scale})`;
            container.dataset.scale = scale;
        }

        // 체크박스 생성
        function initCheckboxes(type) {
            const container = document.getElementById(`list-${type}`);
            dataLists[type].forEach(item => {
                const label = document.createElement('label');
                label.innerHTML = `<input type="checkbox" value="${item}" onchange="renderTags('${type}')"> ${item}`;
                container.appendChild(label);
            });
            renderTags(type);
        }

        // 직접 입력 추가
        function addCustomItem(type) {
            const input = document.getElementById(`custom-${type}`);
            const val = input.value.trim();
            if(val) {
                customData[type].push(val);
                input.value = '';
                renderTags(type);
            }
        }

        // 형광펜 렌더링 로직
        function renderTags(type) {
            const checkedBoxes = Array.from(document.querySelectorAll(`#list-${type} input:checked`)).map(cb => cb.value);
            const canvasContainer = document.getElementById(`canvas-${type}`);
            canvasContainer.innerHTML = '';
            
            // 기본 리스트 렌더링
            dataLists[type].forEach(item => {
                const span = document.createElement('span');
                span.textContent = item + ' ';
                if(checkedBoxes.includes(item)) span.className = 'highlight';
                canvasContainer.appendChild(span);
            });
            
            // 커스텀 리스트 렌더링 (항상 하이라이트)
            customData[type].forEach(item => {
                const span = document.createElement('span');
                span.textContent = item + ' ';
                span.className = 'highlight';
                canvasContainer.appendChild(span);
            });
        }

        // 보딩패스 옵션 업데이트 (성인/미성년자 등)
        function updateBoardingPass() {
            const age = document.querySelector('input[name="age"]:checked').value;
            const fub = document.querySelector('input[name="fub"]:checked').value;
            const rel = document.querySelector('input[name="rel"]:checked').value;
            
            // 하이라이트 적용 함수
            const hl = (arr, sel) => arr.map(v => v === sel ? `<span class="highlight">${v}</span>` : v).join(' / ');
            
            document.getElementById('bp-age-val').innerHTML = hl(['성인', '미성년자', '비공개'], age);
            document.getElementById('bp-fub-val').innerHTML = hl(['O', 'X'], fub);
            document.getElementById('bp-rel-val').innerHTML = hl(['블락', '언블', '맘관블'], rel);
        }

        // 텍스트 및 자동 폰트 리사이징
        function updateText(id, value) {
            const el = document.getElementById(id);
            el.innerText = value || (id === 'quote-box' ? '인용구 입력란' : (id === 'nickname-box' ? '닉네임' : '계정'));
            
            // 폰트 사이즈 자동 조절
            let fontSize = id === 'quote-box' ? 30 : 40; 
            el.style.fontSize = fontSize + 'px';
            const parent = el.parentElement;
            
            while(el.scrollWidth > parent.clientWidth && fontSize > 12) {
                fontSize--;
                el.style.fontSize = fontSize + 'px';
            }
        }

        // 스타일 동기화 (폰트, 컬러)
        function updateStyles() {
            const root = document.documentElement;
            root.style.setProperty('--font-family', document.getElementById('font-select').value);
            root.style.setProperty('--center-color', document.getElementById('color-center').value);
            root.style.setProperty('--bottom-color', document.getElementById('color-bottom').value);
            root.style.setProperty('--shape-color', document.getElementById('color-shape').value);
        }

        // 이미지 업로드 및 드래그 팬(Pan) 설정
        function setupImageUpload(inputId, targetId) {
            const input = document.getElementById(inputId);
            const target = document.getElementById(targetId);
            
            input.addEventListener('change', (e) => {
                if(e.target.files && e.target.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        target.style.backgroundImage = `url(${event.target.result})`;
                        target.classList.add('has-image');
                        target.dataset.bgX = 50; // 퍼센트
                        target.dataset.bgY = 50;
                        target.style.backgroundPosition = `50% 50%`;
                    }
                    reader.readAsDataURL(e.target.files[0]);
                }
            });

            // 마우스 드래그 이벤트 (위치 이동)
            let isDragging = false;
            let startX, startY, startBgX, startBgY;

            target.addEventListener('mousedown', (e) => {
                if(!target.classList.contains('has-image')) return;
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                startBgX = parseFloat(target.dataset.bgX) || 50;
                startBgY = parseFloat(target.dataset.bgY) || 50;
            });

            window.addEventListener('mousemove', (e) => {
                if(!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                
                // 이동 감도 조절
                const scale = parseFloat(document.getElementById('zoom-container').dataset.scale) || 1;
                const newX = startBgX - (dx / scale * 0.1); 
                const newY = startBgY - (dy / scale * 0.1);
                
                target.dataset.bgX = Math.min(100, Math.max(0, newX));
                target.dataset.bgY = Math.min(100, Math.max(0, newY));
                target.style.backgroundPosition = `${target.dataset.bgX}% ${target.dataset.bgY}%`;
            });

            window.addEventListener('mouseup', () => { isDragging = false; });
        }

        // 이미지 저장 (html2canvas)
        function saveImage() {
            const canvas = document.getElementById('canvas');
            // 스케일 일시 초기화 후 캡처하여 고화질 유지
            const container = document.getElementById('zoom-container');
            const originalTransform = container.style.transform;
            container.style.transform = 'scale(1)';
            
            setTimeout(() => {
                html2canvas(canvas, { scale: 1, useCORS: true }).then(img => {
                    const link = document.createElement('a');
                    link.download = 'profile.png';
                    link.href = img.toDataURL('image/png');
                    link.click();
                    container.style.transform = originalTransform; // 스케일 복구
                });
            }, 100);
        }
    </script>
</body>
